#####################################################################
#  INDX USER CONFIGURATION
#####################################################################
#
#  This is the ONLY file you need to edit to adapt INDX to your
#  machine. All other INDX config files derive their values from
#  the variables defined here.
#
#  HOW TO CONFIGURE TOOLS:
#    Set tool_count to the number of tools installed.
#    Then fill in one pair of variables per tool (tN_x, tN_dock_y).
#       x      — X coordinate centred on the tool holder (mm)
#       dock_y — Y coordinate where the tool is fully seated (mm)
#                (deeper into the dock along dock_dir)
#
#    Tool number = variable suffix.  t0 = T0, t1 = T1, etc.
#    Add or remove pairs and update tool_count — the system adapts automatically.
#
#  WHAT IS AUTO-DERIVED:
#    - Trigger Y per tool (dock_y - dock_dir * trigger_offset)
#
#  WHAT NOT TO TOUCH:
#    - E-axis moves and dance geometry are fixed hardware constants
#      defined in indx-tc-macros.cfg. These are determined by the
#      INDX mechanism and must not be changed.
#
#####################################################################

[gcode_macro TOOL_POSITIONS]
description: INDX tool positions (user-configurable)

# ── How many tools are installed ─────────────────────────────────────────────
variable_tool_count: 4

# ── Z-hop during toolchange ──────────────────────────────────────────────────
#  z_hop = distance (mm) to raise Z before the toolhead travels to the dock.
#          Z clears first and lands before any XY movement starts, and on the
#          way back Z only drops once XY has reached the clearance line. Those
#          are separate moves on purpose: running Z and XY together raises or
#          lowers the nozzle gradually across the travel, which drags it over
#          the print at both ends of the change.
#          Set to 0.0 to disable.
variable_z_hop: 5.0

# ── Z offset auto-calibration probe position ─────────────────────────────────
#  Used by CAL_Z_AUTO_ALL to probe each tool and calibrate Z offsets.
#
#  probe_x / probe_y  — centre of the probing area (machine coords, mm).
#                       Set to the centre of your bed. The macro will probe
#                       here for debris clearing, then +5 mm in X for the
#                       actual measurement.
#  probe_fuzz         — legacy fuzz radius, kept for compatibility (mm).
#  probe_z_clearance  — Z height (gcode space) the toolhead travels to before
#                       descending to probe. Must clear any bed features.
variable_probe_x:          -1.0   # set to bed centre X, or -1 to auto-detect
variable_probe_y:          -1.0   # set to bed centre Y, or -1 to auto-detect
variable_probe_fuzz:         2.0
variable_probe_z_clearance: 10.0

# ── Dock approach direction ──────────────────────────────────────────────────
#  dock_dir = Y sign into the dock: -1 front (min Y), +1 rear (max Y).
#             Flips trigger line, unlock depths, and peel relative to dock_y.
variable_dock_dir: -1

# ── Trigger offset ───────────────────────────────────────────────────────────
#  trigger_offset = distance (mm) from dock_y to the trigger line.
#                   trigger_y is auto-derived as: dock_y - dock_dir * trigger_offset
#                   Increase if the latch engages before the tool is fully seated;
#                   decrease if the toolhead overshoots the dock.
variable_trigger_offset: 5.0

# ── Safe lateral travel position ─────────────────────────────────────────────
#  clearance_y = Y coordinate where the toolhead clears ALL docked tools.
#                The toolhead moves here before any X travel between tools.
#                Set this to the Y position where no tool bodies are in the way.
variable_clearance_y: 5.0

# ── Per-tool positions ────────────────────────────────────────────────────────
#  x      = X coordinate of the tool holder centre (mm)
#  dock_y = Y coordinate where the tool is fully seated (mm)
#           Move further along dock_dir to seat the tool deeper.
#
#  To add a tool:    add a new pair of lines and increment tool_count above.
#  To remove a tool: delete its pair of lines and decrement tool_count above.
#
variable_t0_x:      0.0
variable_t0_dock_y: -26
#
variable_t1_x:      43.70
variable_t1_dock_y: -26
#
variable_t2_x:      88.70
variable_t2_dock_y: -26
#
variable_t3_x:      102.0
variable_t3_dock_y: -26
#
# variable_t4_x:     0.0
# variable_t4_dock_y: -26
# #
# variable_t5_x:     0.0
# variable_t5_dock_y: -26
# #
# variable_t6_x:     0.0
# variable_t6_dock_y: -26
# #
# variable_t7_x:      0.0
# variable_t7_dock_y: -26
#

# ── Assembled at startup from the variables above — do not edit ──────────────
variable_tools: []

gcode:

#####################################################################

[gcode_macro DEMON_DOCKS_SETTINGS]
description: Demon dock sensor settings (user-configurable)

variable_demon_docks: False     # Set True if using Demon Dock Sensors
variable_boot_auto_scan: True	# Set True to auto scan for empty docks at boot & disable sensing for those docks 
variable_start_scan_msg: True	# Set False for no warnings for disabled dock sensing
variable_silent_changes: True   # Set True to silence warnings for disabled dock sensors during changes
variable_e_stop: False          # Set True to emergency stop while NOT printing if docking error. When False raise error
variable_e_stop_print: False    # Set True to emergency stop while printing if docking error. When False the print will pause
variable_warn_only: False		# Set True to only repsond with a console error to most detected dock issues. NOTE: E-stops above override this setting
variable_warn_only_print: False # Set True to only repsond with a console error to most detected dock issues. NOTE: E-stops above override this setting
variable_warn_only_lc: True		# Set True to only warn of possible load cell issues when readings go outside loaded/empty settings below
variable_check_load_cell: True  # Set True to use the inbuilt Load Cell Probe to confirm park/pickup
variable_empty_tolerance: 800   # Set your tolerance range for norma Load Cell readings
variable_lc_empty: 2200         # HOME THE PRINTER FIRST - Set your nominal EMPTY toolhead Load Cell readings
variable_loaded_tolerance: 1400 # Set your tolerance range for normal Load Cell readings
variable_lc_loaded: 0           # HOME THE PRINTER FIRST - Set your nominal LOADED toolhead Load Cell readings

# NOTE: Load Cells can be inconsistent & variable. It's best to allow a large tolerance range for operation, even then they might not be that precise!

gcode:

#####################################################################
#  TOOL SHORTCUT MACROS (T0–T3)
#####################################################################
#  Slicers send T0, T1, etc. to select tools. Each macro below
#  routes to CHANGE_TOOL, which validates the index against the
#  tools list above and errors cleanly if the tool doesn't exist.
#
#  If you have more than 4 tools, add more entries following the
#  same one-line pattern.
#####################################################################

[gcode_macro T0]
gcode: CHANGE_TOOL TOOL=0
[gcode_macro T1]
gcode: CHANGE_TOOL TOOL=1
[gcode_macro T2]
gcode: CHANGE_TOOL TOOL=2
[gcode_macro T3]
gcode: CHANGE_TOOL TOOL=3
