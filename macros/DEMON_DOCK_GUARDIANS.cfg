[gcode_macro _DEMON_DOCK_VARS]
gcode:

variable_is_tool_change: False
variable_is_park: False
variable_tc_pause: False
variable_previous_tool: -2
variable_current_tool: -2
variable_next_tool: -2

variable_temp: 0
variable_live_vel: 0
variable_live_acc: 0
variable_counter: 0
variable_tools_undocked: 0

variable_sensor_t0: True
variable_sensor_t1: True
variable_sensor_t2: True
variable_sensor_t3: True
variable_sensor_t4: True
variable_sensor_t5: True
variable_sensor_t6: True
variable_sensor_t7: True
variable_sensor_t8: True
variable_sensor_t9: True
variable_sensor_t10: True
variable_sensor_t11: True
variable_sensor_t12: True
variable_sensor_t13: True
variable_sensor_t14: True



[gcode_macro _DOCKS_BOOT_CHECKER]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set ct = ddv.current_tool|int %}
        
  	{% for i in range(tp.tools|length) %}
    	{% set button = "DOCK_DETECT_T" ~ i|string %}
    	{% if i != ct and printer["gcode_button " ~ button].state == "RELEASED" %}
      		SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=sensor_t{i} VALUE=False
    	{% endif %}
  	{% endfor %}

    

[gcode_macro _DOCKS_SENSOR_READER]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set ct = ddv.current_tool|int %}
        
  	{% for i in range(tp.tools|length) %}
    	{% set sensor = "sensor_t" ~ i|string %}
        {% set state = ddv[sensor] %}
        
        
      	RESPOND TYPE=command MSG="Dock sensor {i} active {state}"
  	{% endfor %}

    

[gcode_macro MANUAL_DOCK_SENSOR_SET]
description: Turn on or off specific dock sensors at runtime. Use Tool number & state on/off 
gcode:
    {% set t = params.TOOL|int %}
    {% set s = params.STATE|string %}
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}

    {% if 'TOOL' not in params %}
    	{action_raise_error("Tool param required, use TOOL=(0-%d)" % (tp.tools|length -1))}
    
    {% elif 'STATE' not in params %}
        {action_raise_error("Use STATE=on or off to set state")}
    {% endif %}
        
    {% if t < 0 or t >= tp.tool_count|int %}
        {action_raise_error("Tool number outside configured range (0-%d)" % (tp.tools|length -1))}
    {% endif %}

    {% if s|lower not in ['on', 'off'] %}
        {action_raise_error("Use on or off to set state")}
    {% endif %}

    {% if s|lower == 'on' %}
    	SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=sensor_t{t} VALUE=True

    {% elif s|lower == 'off' %}
    	SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=sensor_t{t} VALUE=False
    {% endif %}



[gcode_macro _RELEASE_GUARDIAN]
gcode:
    {% set t = params.TOOL|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
    {% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
    {% set ct = ddv.current_tool|int %}
    {% set sensor = "sensor_t" ~ t|string %}
    {% set active = ddv[sensor] %}
    
    {% if active %}
    	{% if printer.print_stats.state == "printing" and not ddv.is_tool_change and t != ct %}
    		SET_DISPLAY_TEXT MSG="WARNING! Inactive Tool {t} has been dislodged!"
    		RESPOND TYPE=error MSG="⚠️ WARNING! Inactive Tool {t} has been dislodged!"
    		{% if dds.e_stop_print %}
     		    M112
    		{% else %}
        		PAUSE
    		{% endif %}

  		{% else %}
    		{% if not ddv.is_tool_change and t != ct %}
     		   	SET_DISPLAY_TEXT MSG="WARNING! Inactive Tool {t} has been dislodged!"
    	    	RESPOND TYPE=error MSG="⚠️ WARNING! Inactive Tool {t} has been dislodged!"
     	 		{% if dds.e_stop %}
    	    		M112
   		   		{% endif %}
  		  	{% endif %}
  		{% endif %}
    {% else %}
        {% if not dds.silent_changes %}
    		RESPOND TYPE=error MSG="⚠️ WARNING! Dock sensor {t} has it's active sensing state disabled to re-enable sensing send: MANUAL_DOCK_SENSOR_SET TOOL={t} STATE=ON or restart klipper with a tool docked! To silence these messages send CHANGE_WARNINGS_OFF"
  		{% endif %}
  	{% endif %}



[gcode_macro CHANGE_WARNINGS_TOGGLE]
description: 
gcode:
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
    
    {% if not dds.silent_changes %}
		SET_GCODE_VARIABLE MACRO=DEMON_DOCKS_SETTINGS VARIABLE=silent_changes VALUE=True
		RESPOND TYPE=command MSG="Tool change warnings are now off. To make this a persitant change variable silent_changes to True in indx.cfg"

    {% elif dds.silent_changes %}
 		SET_GCODE_VARIABLE MACRO=DEMON_DOCKS_SETTINGS VARIABLE=silent_changes VALUE=False
		RESPOND TYPE=command MSG="Tool change warnings are now on. To make this a persitant change variable silent_changes to False in indx.cfg"
    {% endif %}


[gcode_macro START_WARNINGS_TOGGLE]
gcode:
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}

    {% if dds.start_scan_msg %}
		SET_GCODE_VARIABLE MACRO=DEMON_DOCKS_SETTINGS VARIABLE=start_scan_msg VALUE=False
		RESPOND TYPE=command MSG="Start warnings are now off. To make this a persitant change variable start_scan_msg to False in indx.cfg"

    {% elif dds.silent_changes %}
		SET_GCODE_VARIABLE MACRO=DEMON_DOCKS_SETTINGS VARIABLE=start_scan_msg VALUE=True
		RESPOND TYPE=command MSG="Start warnings are now on. To make this a persitant change variable start_scan_msg to True in indx.cfg"
    {% endif %}


[gcode_macro CHECK_LOAD_CELL_TOGGLE]
gcode:
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}

	{% if dds.check_load_cell %}
		SET_GCODE_VARIABLE MACRO=DEMON_DOCKS_SETTINGS VARIABLE=check_load_cell VALUE=False
		RESPOND TYPE=command MSG="Load Cell checks are now disabled. To make this a persitant change variable check_load_cell to False in indx.cfg"

    {% elif not dds.check_load_cell %}
		SET_GCODE_VARIABLE MACRO=DEMON_DOCKS_SETTINGS VARIABLE=check_load_cell VALUE=True
		RESPOND TYPE=command MSG="Load Cell checks are now enabled. To make this a persitant change variable check_load_cell to True in indx.cfg"
    {% endif %}

            

[gcode_macro _TOOL_DOCK_GUARDIAN]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set ct = ddv.current_tool|int %}
    {% set bas = dds.boot_auto_scan %}
    {% set smsg = dds.start_scan_msg %}

  	{% if printer['mcu docks'].non_critical_disconnected %}
    	RESPOND TYPE=error MSG="⚠️ Non-critiacal MCU docks is disconnected!"

  	{% else %}
    	{% for i in range(tp.tools|length) %}
      		{% set button = "DOCK_DETECT_T" ~ i|string %}
            {% set sensor = "sensor_t" ~ i|string %}
        	{% set active = ddv[sensor] %}
  
      		{% if printer["gcode_button " ~ button].state == "RELEASED" %}
                {% if i != ct and bas and smsg %}
            		RESPOND TYPE=error MSG="⚠️ WARNING! Dock sensor {i} was empty at boot so it's active sensing state has been disabled! Send: MANUAL_DOCK_SENSOR_SET TOOL={i} STATE=ON or restart klipper with a tool docked to re-enable sensing! To silence these messages send START_WARNINGS_OFF"
                {% endif %}
                
        		{% if i != ct and active %}
          			RESPOND TYPE=error MSG="⚠️ WARNING! INACTIVE TOOL {i} IS NOT DOCKED!"
          			{% if printer.print_stats.state == "printing" %}
            			{% if dds.e_stop_print %}
              				M112
            			{% else %}
                            {% if dds.warn_only_print %}
      							RESPOND TYPE=error MSG="⚠️ WARNING! INACTIVE TOOL %d IS NOT DOCKED!"

                        	{% else %}
              					{action_raise_error("⚠️ WARNING! INACTIVE TOOL %d IS NOT DOCKED! OPERATION CANCELLED!" % i)}
                			{% endif %}
                		{% endif %}
          
          			{% else %}
            			{% if dds.e_stop %}
             	 			M112
            			{% else %}
                        	{% if dds.warn_only %}
      							RESPOND TYPE=error MSG="⚠️ WARNING! INACTIVE TOOL %d IS NOT DOCKED!"

                        	{% else %}
              					{action_raise_error("⚠️ WARNING! INACTIVE TOOL %d IS NOT DOCKED! OPERATION CANCELLED!" % i)}
                        	{% endif %}
                        {% endif %}
          			{% endif %}  
        		{% endif %}
      		{% endif %}  
    	{% endfor %}
  	{% endif %}



[gcode_macro _RESUME_CHECKER]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set ct = ddv.current_tool|int %}
        
  	{% for i in range(tp.tools|length) %}
    	{% set button = "DOCK_DETECT_T" ~ i|string %}
        {% set sensor = "sensor_t" ~ i|string %}
        {% set active = ddv[sensor] %}
        
    	{% if i != ct and active and printer["gcode_button " ~ button].state == "RELEASED" %}
      		{action_raise_error("⚠️ WARNING! AN INACTIVE TOOL %d IS NOT DOCKED! OPERATION CANCELLED!" % i)}
    	{% endif %}
  	{% endfor %}



[gcode_macro _TC_PAUSE_PROMPT]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}

  	{% if dds.demon_docks %}
    	{% if ddv.tc_pause %}
      		_PAUSE_RESUME_SCREEN
    	{% endif %}
  	{% endif %}



[gcode_macro _PAUSE_RESUME_SCREEN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin DEMON DOCK GUARDIAN"
    RESPOND TYPE=command MSG="action:prompt_text We detected an undocked inactive tool during a tool change! Dock all tools & press RESUME below to continue! DO NOT CANCEL THIS SCREEN!"
    RESPOND TYPE=command MSG="action:prompt_footer_button PICKUP NEXT TOOL & RESUME|_PAUSE_GUARDIAN|error"
    RESPOND TYPE=command MSG="action:prompt_show"



[gcode_macro _PAUSE_GUARDIAN]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}

    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=counter VALUE=0
    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=tools_undocked VALUE=0
      
  	{% for i in range(tp.tools|length) %}
    	{% set button = "DOCK_DETECT_T" ~ i|string %}
        {% set sensor = "sensor_t" ~ i|string %}
        {% set active = ddv[sensor] %}
  
    	{% if printer["gcode_button " ~ button].state == "RELEASED" and active %}
        	_TOOLS_UNDOCKED
                           
    	{% else %}
      		{% if printer.print_stats.state == "paused" %}
        		_COUNTER_SET
        		M400               
        		_DPG_COUNTER_COMPLETE
      
      		{% else %}
        		{action_raise_error("⚠️ OPERATION CANCELLED! Due to a printing state error!")}
      		{% endif %}
    	{% endif %}
  	{% endfor %}

    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=counter VALUE=0
    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=tools_undocked VALUE=0



[gcode_macro _TOOLS_UNDOCKED]
gcode:
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}

    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=tools_undocked VALUE={ddv.tools_undocked +1}



[gcode_macro _DPG_COUNTER_COMPLETE]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set ct = ddv.current_tool|int %}

  	{% if ddv.counter == tp.tools|length and ddv.tools_undocked == 0 %}
    	{% if ddv.tc_pause %}
      		{% set nt = ddv.next_tool|int %}
      		{% set target_temp = ddv.temp|float %}
      		{% set zhop = tp.z_hop|float %}

      		RESPOND TYPE=command MSG="action:prompt_end"
      		_PICKUP_TOOL TOOL={nt} TARGET={target_temp} ZHOP={0.0 if ct != -1 else zhop} RESTORE_Z=False SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)|int}
      		_RESTORE_EXTRUDER_CURRENT
      		SET_VELOCITY_LIMIT VELOCITY={ddv.live_vel} ACCEL={ddv.live_acc}
      		M400
      		RESUME
      		RESPOND TYPE=command MSG="Klipper RESUME macro commanding return to point where the print was pasued...."
    	{% endif %}

  	{% else %}
    	_PAUSE_RESUME_SCREEN       
  	{% endif %}



[gcode_macro _PARK_GUARDIAN]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set pt = ddv.previous_tool|int %}
  	{% set nt = ddv.next_tool|int %}
  	{% set grams = printer.load_cell_probe.force_g|float %}
  	{% set act = printer.save_variables.variables.active_tool|default(-1)|int %}

  	{% if 'load_cell_probe' in printer and printer.load_cell_probe.is_calibrated %}
    	{% set grams = printer.load_cell_probe.force_g|float %}
    	{% set empty_lo = (dds.lc_empty|int - dds.empty_tolerance|int) %}
    	{% set empty_hi = (dds.lc_empty|int + dds.empty_tolerance|int) %}
    	RESPOND TYPE=COMMAND MSG="Load cell EMPTY tolerance range {empty_lo}g - {empty_hi}g, reading was {grams}g"
  	{% endif %}
        
  	{% if pt == -2 %}
    	SET_DISPLAY_TEXT MSG="PARK_GUARDIAN system did not operate!"
    	RESPOND TYPE=error MSG="⚠️ WARNING! PARK_GUARDIAN system did not operate!"

  	{% elif pt != -2 %} 
    	{% for i in range(tp.tools|length) %}
      		{% set button = "DOCK_DETECT_T" ~ i|string %}
            {% set sensor = "sensor_t" ~ i|string %}
        	{% set active = ddv[sensor] %}
      		# Park failed
            {% if active %}
      			{% if pt == i and printer["gcode_button " ~ button].state == "RELEASED" %}
        			{% if dds.check_load_cell %}
          				{% if 'load_cell_probe' in printer and printer.load_cell_probe.is_calibrated and act == -1 %}
            				{% if grams <= empty_hi and grams >= empty_lo %}
            				{% else %}
              					RESPOND TYPE=error MSG="⚠️ WARNING! The toolhead might still be holding an unsecured tool, load cell readings outside tolerance range"
              					{% if not dds.warn_only_lc %}
                                	_FAILURE_HANDLER
            					{% endif %}
            				{% endif %}
          				{% endif %}
        			{% endif %}
        
        			SET_DISPLAY_TEXT MSG="TOOL {i} PARK FAILED!"
        			RESPOND TYPE=error MSG="⚠️ WARNING! TOOL {i} PARK FAILED!"
       	 			_FAILURE_HANDLER

      			{% else %}
        		# Parked
        			{% if pt == i and printer["gcode_button " ~ button].state == "PRESSED" %}
          				RESPOND TYPE=COMMAND MSG="✅ TOOL {i} PARK OK!"
          				{% if dds.check_load_cell %}
            				{% if 'load_cell_probe' in printer and printer.load_cell_probe.is_calibrated and act == -1 %}
              					{% if grams <= empty_hi and grams >= empty_lo %}
                					RESPOND TYPE=COMMAND MSG="✅ TOOL {i} LOAD CELL CONFIRMED PARK!"
              					{% else %}
              						RESPOND TYPE=error MSG="⚠️ WARNING! The toolhead might still be holding an unsecured tool, load cell readings outside tolerance range"
              						{% if not dds.warn_only_lc %}
                                		_FAILURE_HANDLER
            						{% endif %}
              					{% endif %}
            
            				{% else %}          
              					RESPOND TYPE=COMMAND MSG="✅ TOOL {i} PARK OK! LOAD CELL NOT USED"
            				{% endif %}
            
          				{% else %}          
              				RESPOND TYPE=COMMAND MSG="✅ TOOL {i} PARK OK!"
          				{% endif %}    
        			{% endif %}
      			{% endif %}
      		{% endif %}
    	{% endfor %} 
  	{% endif %}

    M400
    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=is_park VALUE=False
    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=previous_tool VALUE=-2
    
  	{% if not ddv.is_tool_change %}
    	SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=current_tool VALUE=-2
  	{% endif %}
    M400



[gcode_macro _PICKUP_GUARDIAN]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}
  	{% set nt = ddv.next_tool|int %}

  	{% if 'load_cell_probe' in printer and printer.load_cell_probe.is_calibrated %}
    	{% set grams = printer.load_cell_probe.force_g|float %}
    	{% set loaded_lo = (dds.lc_loaded|int - dds.loaded_tolerance|int) %}
    	{% set loaded_hi = (dds.lc_loaded|int + dds.loaded_tolerance|int) %}
    	RESPOND TYPE=COMMAND MSG="Load cell LOADED tolerance range {loaded_lo}g - {loaded_hi}g, reading was {grams}g"
  	{% endif %}

  	{% if nt == -2 %}
    	SET_DISPLAY_TEXT MSG="PICKUP_GUARDIAN system did not operate!"
    	RESPOND TYPE=error MSG="⚠️ WARNING! PICKUP_GUARDIAN system did not operate!"

  	{% elif nt != -2 %} 
    	{% for i in range(tp.tools|length) %}
      		{% set button = "DOCK_DETECT_T" ~ i|string %}  
            {% set sensor = "sensor_t" ~ i|string %}
            {% set active = ddv[sensor] %}

            {% if active %}
      			{% if nt == i and printer["gcode_button " ~ button].state == "PRESSED" %}
        			{% if dds.check_load_cell %}
          				{% if 'load_cell_probe' in printer and printer.load_cell_probe.is_calibrated %}
            				{% if grams <= loaded_hi and grams >= loaded_lo %}
            				{% else %}
              					RESPOND TYPE=error MSG="⚠️ WARNING! The toolhead might still be holding an unsecured tool, load cell readings outside tolerance range"
              						{% if not dds.warn_only_lc %}
                                		_FAILURE_HANDLER
            						{% endif %}
            				{% endif %}
          				{% endif %}
        			{% endif %}
        
        			SET_DISPLAY_TEXT MSG="TOOL {i} PICKUP FAILED!"
        			RESPOND TYPE=error MSG="⚠️ WARNING! TOOL {i} PICKUP FAILED!"
        			_FAILURE_HANDLER

      			{% else %}
        			{% if nt == i and printer["gcode_button " ~ button].state == "RELEASED" %}
          				RESPOND TYPE=COMMAND MSG="✅ TOOL {i} PICKUP OK!"
          				{% if dds.check_load_cell %} 
            				{% if 'load_cell_probe' in printer and printer.load_cell_probe.is_calibrated %}
              					{% if grams <= loaded_hi and grams >= loaded_lo %}
                					RESPOND TYPE=COMMAND MSG="✅ TOOL {i} LOAD CELL CONFIRMED PICKUP!"
              					{% else %}
              						RESPOND TYPE=error MSG="⚠️ WARNING! The toolhead might still be holding an unsecured tool, load cell readings outside tolerance range"
              						{% if not dds.warn_only_lc %}
                                		_FAILURE_HANDLER
            						{% endif %}
              					{% endif %}
            
            				{% else %}          
              					RESPOND TYPE=COMMAND MSG="✅ TOOL {i} PARK OK! LOAD CELL NOT USED"
            				{% endif %}
            
          				{% else %}          
            				RESPOND TYPE=COMMAND MSG="✅ TOOL {i} PARK OK!"
          				{% endif %}      
        			{% endif %}
      			{% endif %}
      		{% endif %}
    	{% endfor %} 
  	{% endif %}

    M400
    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=is_tool_change VALUE=False
    SET_GCODE_VARIABLE MACRO=_DEMON_DOCK_VARS VARIABLE=next_tool VALUE=-2
    M400



[gcode_macro _FAILURE_HANDLER]
gcode:
  	{% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
  	{% set dds = printer["gcode_macro DEMON_DOCKS_SETTINGS"] %}
  	{% set ddv = printer["gcode_macro _DEMON_DOCK_VARS"] %}

  	{% if printer.print_stats.state == "printing" %}
    	{% if dds.e_stop_print %}
      		M112
     
    	{% else %}
        	{% if dds.warn_only_print %}
      			RESPOND TYPE=error MSG="⚠️ WARNING! Check your docks/toolhead, possible issue detected!"
    		
            {% else %}
      			PAUSE
            {% endif %}
    	{% endif %}
          
  	{% else %}
    	{% if dds.e_stop %}
      		M112
      
    	{% else %}
          	{% if dds.warn_only %}
      			RESPOND TYPE=error MSG="⚠️ WARNING! Check your docks/toolhead, possible issue detected!"
            
            {% else %}
      			{action_raise_error("⚠️ OPERATION CANCELLED!")}
    		{% endif %}
    	{% endif %}
  	{% endif %}



[gcode_macro LOAD_CELL_CHECK]
gcode:

  	{% set grams = printer.load_cell_probe.force_g|float %}
  	{% set min_grams = printer.load_cell_probe.min_force_g|float %}
  	{% set max_grams = printer.load_cell_probe.max_force_g|float %}
  
  	{% set tf = printer.load_cell_probe.tare_force|float %}
  	{% set tare = printer.load_cell_probe.tare_counts|float %}
  	{% set r = tf + grams|float %}

  	{% if printer.load_cell_probe.is_calibrated %}
    	RESPOND TYPE=COMMAND MSG="Load Cell is calibrated"
  	{% else %}
    	RESPOND TYPE=COMMAND MSG="Load Cell is NOT calibrated"
  	{% endif %}
    
    RESPOND TYPE=COMMAND MSG="Load cell force {grams}g" 
    RESPOND TYPE=COMMAND MSG="Load cell min_force {min_grams}g" 
    RESPOND TYPE=COMMAND MSG="Load cell max_force {max_grams}g" 
    RESPOND TYPE=COMMAND MSG="Load cell tare force {tf}"
    RESPOND TYPE=COMMAND MSG="Load cell tare {tare}"

    
